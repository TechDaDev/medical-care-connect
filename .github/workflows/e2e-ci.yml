name: E2E CI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mcc_e2e
          POSTGRES_USER: mcc_e2e
          POSTGRES_PASSWORD: mcc_e2e_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: e2e-test-key
          DEBUG: "True"
          POSTGRES_DB: mcc_e2e
          POSTGRES_USER: mcc_e2e
          POSTGRES_PASSWORD: mcc_e2e_pass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: python manage.py test

      - name: Seed & backup
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: e2e-test-key
          DEBUG: "True"
          POSTGRES_DB: mcc_e2e
          POSTGRES_USER: mcc_e2e
          POSTGRES_PASSWORD: mcc_e2e_pass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: |
          python manage.py migrate
          python manage.py seed_development_data
          python manage.py backup_database --execute
          python manage.py verify_backup --manifest backups/*.manifest.json
