name: Backend CI

on:
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - "Dockerfile"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mcc_test
          POSTGRES_USER: mcc_test
          POSTGRES_PASSWORD: mcc_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-test-key-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          POSTGRES_DB: mcc_test
          POSTGRES_USER: mcc_test
          POSTGRES_PASSWORD: mcc_test_pass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          AI_INTAKE_ENABLED: "False"
          DEEPSEEK_API_KEY: ""
        run: |
          python manage.py check
          python manage.py makemigrations --check
          python manage.py migrate
          python manage.py test

      - name: Collect staticfiles
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-test-key-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          POSTGRES_DB: mcc_test
          POSTGRES_USER: mcc_test
          POSTGRES_PASSWORD: mcc_test_pass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: python manage.py collectstatic --noinput

      - name: Production settings check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-prod-check-key
          DEBUG: "False"
          ALLOWED_HOSTS: ci.example.com
          CORS_ALLOWED_ORIGINS: https://ci.example.com
          POSTGRES_DB: mcc_test
          POSTGRES_USER: mcc_test
          POSTGRES_PASSWORD: mcc_test_pass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: python manage.py check --deploy

      - name: Build Docker image
        run: docker build --no-cache -t mcc-backend:ci .
