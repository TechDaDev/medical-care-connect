# E2E test environment — runs Playwright against production-like stack.
# Usage: docker compose -f docker-compose.e2e.yml up --abort-on-container-exit --exit-code-from e2e
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mcc_e2e
      POSTGRES_USER: mcc_e2e
      POSTGRES_PASSWORD: mcc_e2e_pass
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mcc_e2e"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: /home/zeus3000/PycharmProjects/mcc_backend
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: e2e-test-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://frontend:5173
      POSTGRES_DB: mcc_e2e
      POSTGRES_USER: mcc_e2e
      POSTGRES_PASSWORD: mcc_e2e_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      AI_INTAKE_ENABLED: "False"
      ATTACHMENT_SCAN_MODE: disabled
      ATTACHMENT_RETENTION_DAYS: "0"
      LOG_LEVEL: WARNING
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: nginx:alpine
    volumes:
      - /home/zeus3000/PycharmProjects/mcc_frontend/dist:/usr/share/nginx/html:ro
      - /home/zeus3000/PycharmProjects/mcc_frontend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"
    depends_on:
      - backend

  e2e:
    image: mcr.microsoft.com/playwright:v1.61.1-jammy
    working_dir: /test
    volumes:
      - /home/zeus3000/PycharmProjects/mcc_frontend/e2e:/test/e2e:ro
      - /home/zeus3000/PycharmProjects/mcc_frontend/playwright.config.ts:/test/playwright.config.ts:ro
      - /home/zeus3000/PycharmProjects/mcc_frontend/package.json:/test/package.json:ro
    environment:
      E2E_BASE_URL: http://frontend:5173
      E2E_PATIENT_EMAIL: john.doe@mcc.dev
      E2E_PATIENT_PASSWORD: Development123!
      E2E_DOCTOR_EMAIL: dr.ali@mcc.dev
      E2E_DOCTOR_PASSWORD: Development123!
      E2E_COORDINATOR_EMAIL: coordinator@mcc.dev
      E2E_COORDINATOR_PASSWORD: Development123!
    command: >
      sh -c "
      cd /test &&
      npx playwright test --reporter=list 2>&1
      "
    depends_on:
      - frontend
